        <h1>國立臺灣師範大學　東亞學系</h1>
        <p><strong>Department of East Asian Studies, National Taiwan Normal University</strong></p>
        <p>國內唯一具備學士、碩士、博士完整學制的東亞研究學系。於 100 學年度由東亞文化暨發展學系與國際漢學研究所整併成立，104 學年度政治學研究所併入，106 學年度增設博士班。以文化與應用、政經與區域發展為兩大主軸。</p>

        <h2>學術主軸</h2>
        <ul>
          <li><strong>文化與應用</strong>：東亞儒學、國際漢學、東亞文學與電影、文化遺產、華僑研究、文化政策。</li>
          <li><strong>政經與區域發展</strong>：國際關係、兩岸關係、國際政治經濟學、東南亞政治、海洋政策、金融與經濟成長。</li>
        </ul>

        <h2>學制</h2>
        <ul>
          <li>學士班　文學士（B.A.）</li>
          <li>碩士班　社會科學碩士（M.S.S.）</li>
          <li>碩士在職專班　國家安全與國際事務研究，社會科學碩士（M.S.S.）</li>
          <li>博士班　社會科學博士（Ph.D.），106 學年度起招生</li>
        </ul>

        <h2>師資規模</h2>
        <p>專任教師 16 位，含教授 8 位、副教授 6 位、助理教授 2 位；另有合聘、兼任與榮退教師及行政團隊。現任系主任為林昌平副教授。</p>

        <h2>系級研究中心</h2>
        <ul>
          <li><a href="https://rcocntnu.blogspot.com/">海外華人研究中心</a>（Research Center for the Overseas Chinese，2014 年成立）</li>
          <li><a href="https://vocus.cc/user/66878b86fd8978000199fb7e">中國大陸研究中心</a>（Research Center for Mainland China Studies，2015 年成立）</li>
          <li><a href="https://ntnueasjrc.blogspot.com/">日本研究中心</a>（Japan Research Center，2020 年成立）</li>
        </ul>

        <h2>系所位置</h2>
        <p>106308 臺北市大安區和平東路一段162號，臺師大校本部誠大樓 9 樓。捷運古亭站 4 號出口或臺電大樓站 2 號出口步行約 8 分鐘；公車 15、18、235、237、278、295、662、663、672、907 及和平幹線至師大站或師大一站。</p>
